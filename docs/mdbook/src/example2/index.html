<html>
<head>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ngyewch/leaflet-webcomponent@0.6.0/dist/leaflet-webcomponent.js"></script>
</head>
<body>
<leaflet-map>
    <script type="application/json">
        {
            "options": {
                "center": [
                    1.3521,
                    103.8198
                ],
                "zoom": 3
            },
            "scaleOptions": {
                "maxWidth": 200
            },
            "baseLayers": [
                {
                    "name": "OpenStreetMaps",
                    "config": {
                        "kind": "TileLayer",
                        "urlTemplate": "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                        "options": {
                            "attribution": "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
                        }
                    }
                }
            ],
            "overlayLayers": [
                {
                    "name": "OpenSeaMap",
                    "selected": false,
                    "config": {
                        "kind": "TileLayer",
                        "urlTemplate": "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
                        "options": {
                            "opacity": 0.2,
                            "attribution": "&copy; <a href=\"http://www.openseamap.org\">OpenSeaMap</a> contributors"
                        }
                    }
                },
                {
                    "name": "Singapore Neighbourhoods",
                    "selected": false,
                    "config": {
                        "kind": "GeoJSON",
                        "id": "singapore-neighbourhoods",
                        "fitBounds": true,
                        "options": {
                            "attribution": "&copy; <a href=\"https://insideairbnb.com/get-the-data/\">Inside Airbnb</a> contributors"
                        }
                    }
                },
                {
                    "name": "Cycling Path Network",
                    "selected": false,
                    "config": {
                        "kind": "GeoJSON",
                        "id": "cycling-path-network",
                        "fitBounds": true,
                        "options": {
                            "attribution": "<a href=\"https://data.gov.sg/open-data-licence\">data.gov.sg</a>"
                        }
                    }
                }
            ]
        }
    </script>
    <script id="singapore-neighbourhoods" type="application/geo+json" src="neighbourhoods.geojson"></script>
    <script id="cycling-path-network" type="application/geo+json" src="CyclingPathNetworkGEOJSON.geojson"></script>
</leaflet-map>
</body>
</html>
